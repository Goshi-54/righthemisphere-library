<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>でぷれさん素材ライブラリ</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--surface:#fff;--ink:#1c2230;--muted:#5d6676;--line:#e2e5ea;--accent:#2563c9;--accent-soft:#e8f0fc;--stage:#eef0f3;--ok:#1d7a4a;--okbg:#e3f4ea;--warn:#9a5b00;--warnbg:#fdf1dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171c;--surface:#1c2027;--ink:#e6e9ee;--muted:#9aa3b2;--line:#2c323c;--accent:#7fa8ee;--accent-soft:#1f2a3d;--stage:#232830;--ok:#7fd1a4;--okbg:#1b3327;--warn:#f0c07a;--warnbg:#3a2e17}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171c;--surface:#1c2027;--ink:#e6e9ee;--muted:#9aa3b2;--line:#2c323c;--accent:#7fa8ee;--accent-soft:#1f2a3d;--stage:#232830;--ok:#7fd1a4;--okbg:#1b3327;--warn:#f0c07a;--warnbg:#3a2e17}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.6;overflow-wrap:anywhere}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:9px;min-height:38px;padding:7px 13px;font-weight:600;background:var(--surface);color:var(--ink)}
button:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.35}
p{margin:0 0 10px}
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{padding:16px clamp(16px,3vw,32px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:20px;letter-spacing:-.01em}
.link-btn{display:inline-flex;align-items:center;min-height:0;padding:3px 10px;border-radius:8px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;text-decoration:none;line-height:1.6}
:root[data-theme="dark"] .link-btn{color:#14171c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link-btn{color:#14171c}}
.menu-btn{min-height:38px;width:40px;padding:0;display:inline-grid;place-items:center;border-radius:9px}
.menu-btn svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:12px}
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 71px)}
.side{position:sticky;top:0;flex:0 0 220px;max-height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:14px 10px 24px;align-self:stretch}
.side h2{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:16px 10px 6px}
.side button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;background:transparent;border:0;border-radius:8px;min-height:38px;padding:7px 10px;font-size:14px;font-weight:600;color:var(--ink);text-align:left}
.side button:hover{background:var(--accent-soft)}
.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side button span{font-size:11px;background:var(--line);color:var(--ink);padding:1px 8px;border-radius:20px;font-weight:600}
.side-closed .side{display:none}
.shell{flex:1;min-width:0;width:auto;margin:0;padding:20px clamp(16px,3vw,32px) 40px}
.page-title{font-size:22px;margin:0 0 14px}
.scrim{display:none}
.home-lead{color:var(--muted);margin:-6px 0 18px}
/* 11/18 要望素材：依頼の文を作る */
.req-maker{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 22px;display:grid;gap:12px;max-width:760px}
.req-maker .group-title{margin:0}
.req-kinds button:disabled{opacity:.35;cursor:not-allowed}
.req-hint{margin:6px 0 0;color:var(--muted);font-size:13px}
.req-hint:empty{display:none}
/* 11/18 本人「トグル形式みたいな感じで必要な時に出す感じにしたい。非表示時のサイズ感は下のフォルダを開くボタンと合わせれれば。」（意思決定DB 41cc12971e278177925acc5c8e93f04d） */
.req-maker:not([open]){background:none;border:0;padding:0;margin:0 0 10px}
.req-maker>summary{list-style:none;cursor:pointer;width:max-content}
.req-maker>summary::-webkit-details-marker{display:none}
.req-maker>summary::after{content:"▾";margin-left:6px;font-size:10px}
.req-maker[open]>summary::after{content:"▴"}
.req-field{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.req-field>span{font-weight:700}
.req-field textarea,.req-field input{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;box-sizing:border-box}
.req-field textarea:focus,.req-field input:focus{outline:2px solid var(--accent);outline-offset:1px}
.req-kinds{display:flex;flex-wrap:wrap;gap:6px}
.req-kinds button{font-size:13px;padding:4px 12px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:0}
.req-kinds button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
:root[data-theme="dark"] .req-kinds button[aria-checked="true"]{color:#14171c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .req-kinds button[aria-checked="true"]{color:#14171c}}
.req-label{font-size:13px;font-weight:700;color:var(--muted)}
.req-out{margin:-6px 0 0;background:var(--stage);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.req-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.req-foot button{font-size:13px;padding:5px 14px;border-radius:8px;background:var(--accent);color:#fff;border:0;font-weight:700;cursor:pointer}
.req-foot button:disabled{opacity:.45;cursor:default}
:root[data-theme="dark"] .req-foot button{color:#14171c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .req-foot button{color:#14171c}}
.req-note{font-size:13px;color:var(--muted);margin:0}
.home-group{font-size:13px;color:var(--muted);font-weight:700;margin:22px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;padding:0;overflow:hidden;border-radius:14px;text-align:left;font-weight:400;min-height:0}
.tile .thumb{aspect-ratio:4/3;background:var(--stage);display:grid;place-items:center;overflow:hidden;width:100%}
.tile .thumb img,.tile .thumb video{width:100%;height:100%;object-fit:contain;display:block}
.tile .thumb.cover img{object-fit:cover}
.tile .thumb .script-mark{font-size:13px;color:var(--muted);padding:16px;line-height:1.7}
.tile .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-weight:700;font-size:14px}
.tile .cap span{font-size:11px;background:var(--line);padding:1px 8px;border-radius:20px;font-weight:600}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:26px;font-size:14px}
.howto h2{font-size:15px;margin-bottom:8px}
.howto ul{margin:0;padding-left:1.2em}
.howto li{margin:3px 0}
@media (max-width:820px){
  .side{position:fixed;top:0;left:0;bottom:0;z-index:20;width:250px;max-height:none;box-shadow:4px 0 24px #0003;transform:translateX(-100%);transition:transform .2s;display:block}
  .side-open .side{transform:none}
  .side-closed .side{display:block}
  .side-open .scrim{display:block;position:fixed;inset:0;z-index:15;background:#0005}
}
.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:38px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#14171c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#14171c}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;font-weight:400}
.stage{background:var(--stage);aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden;grid-template:100% / 100%}
.dl-fab{position:absolute;right:8px;bottom:8px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(28,34,48,.5);color:#fff;display:grid;place-items:center;text-decoration:none;opacity:.8;transition:opacity .15s,background .15s}
.dl-fab svg{width:16px;height:16px}
.dl-fab:hover,.dl-fab:focus-visible{opacity:1;background:var(--accent)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.icon-card .dl-fab{width:26px;height:26px;right:8px;top:62px;bottom:auto}
.icon-card .dl-fab svg{width:14px;height:14px}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.fname{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.fname strong{font-size:13px;font-weight:600;line-height:1.45}
.fname small{font-size:11px;color:var(--muted)}
.kicker{font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--muted);margin:0 0 4px}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:10px;border-radius:20px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.plain{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:400}
.scripts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.script{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.script header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.script h3{font-size:18px}
.script audio{width:100%;margin:6px 0 12px}
.script .text{font-size:15px;line-height:1.9;border-top:1px solid var(--line);padding-top:12px}
.script .text p{margin:0 0 14px}
.snd{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.snd summary{font-size:13px;font-weight:700;cursor:pointer;color:var(--accent);padding:4px 0}
.snd-row{padding:10px 0;border-bottom:1px solid var(--line)}
.snd-row strong{font-size:13px}
.snd-row audio{width:100%;height:36px;margin:6px 0 2px}
.snd-note{font-size:11px;color:var(--muted);margin:0}
.loc{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small-btn{min-height:30px;padding:3px 10px;font-size:12px}
.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,280px));gap:14px}
.bg-grid video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block}
/* 11/19 本人「今の保留やアイコンに入っている素材含め表示に一貫性を持たせたいです。」「小さなアイコンも嫌だし、透過素材なのに白いものの上も嫌。素材として見やすいようにバランスとって」
   （意思決定DB 41dc12971e2781e19431e1e3d9da663e・41dc12971e278162ab04d0a1f806c3cb）→ 札の絵の枠を、どの種類も同じ大きさ（4:3）にし、透過が分かる市松の地に置く */
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.hold-empty{color:var(--muted);padding:24px 0}
.group-title.group-target{scroll-margin-top:72px;outline:2px solid var(--accent,#7aa7ff);outline-offset:6px;border-radius:6px}
.hold-meta{color:var(--muted);font-size:13px;margin:-4px 0 10px}
.hold-kind{font-size:11px;color:var(--muted)}
.hold-state{display:inline-block;font-size:11px;font-weight:700;padding:0 8px;border-radius:10px;background:var(--warnbg);color:var(--warn);margin-top:2px}
.hold-state.s-採用,.hold-state.s-仮置き{background:var(--okbg);color:var(--ok)}
.hold-memo{font-size:11px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.icon-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.icon-card{--chk-a:#e9ecf0;--chk-b:#dfe3e8}
:root[data-theme="dark"] .icon-card{--chk-a:#262b33;--chk-b:#2e343d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .icon-card{--chk-a:#262b33;--chk-b:#2e343d}}
.icon-card>img,.icon-card>video,.hold-compare img,.hold-compare video{width:100%;aspect-ratio:4/3;height:auto;object-fit:contain;display:block;margin:0 0 8px;padding:5%;border-radius:8px;background:repeating-conic-gradient(var(--chk-a) 0 25%,var(--chk-b) 0 50%) 0 0/16px 16px}
.icon-card.pixel>img{image-rendering:pixelated}
/* p01 and the requested Claude Code animations use the same native-size preview. */
.icon-card.cc-sprite>img,.icon-card.cc-sprite .hold-compare img{width:160px;max-width:100%;height:auto;aspect-ratio:1;object-fit:contain;padding:0;margin:0 auto 8px;image-rendering:pixelated}
.icon-grid:has(>.cc-sprite){grid-template-columns:repeat(auto-fill,minmax(min(100%,184px),1fr))}
.icon-card.cc-sprite .dl-fab{top:8px}

.side button.sub{padding-left:28px;font-weight:500;font-size:13px;position:relative}
.side button.sub::before{content:"";position:absolute;left:14px;top:6px;width:8px;height:12px;border-left:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted)}
.folder-card{display:flex;align-items:center;gap:14px;width:100%;max-width:560px;margin:0 0 18px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.folder-card:hover{border-color:var(--accent)}
.folder-card svg{width:40px;height:40px;flex:none;color:var(--accent)}
.folder-txt{display:flex;flex-direction:column;gap:2px}.folder-txt strong{font-size:15px}.folder-txt span{font-size:12px;color:var(--muted)}
.crumb{font-size:13px;margin:0 0 14px;color:var(--muted)}.crumb-link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;font-size:13px}
.hold-grid-wide{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.hold-native-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.hold-native-gif>img{width:min(100%,362px);height:auto;border-radius:8px}
.hold-native-gif .hold-open{display:inline-flex;margin-top:8px}
.hold-movie .dl-fab{top:auto;bottom:8px}
.hold-grid-wide:has(.hold-compare){grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.hold-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 8px}
.hold-compare figure{margin:0;border-radius:8px;overflow:hidden}
.hold-compare figcaption{font-size:11px;color:var(--muted,#667);padding:4px 0 6px}
.icon-card strong{display:block;font-size:12px;font-weight:600}
.icon-card.dark>img{--chk-a:#2b3038;--chk-b:#323843}
.group-title{font-size:15px;margin:22px 0 10px}
.pending{margin-top:34px;padding-top:6px;border-top:2px dashed var(--line)}
.pending-title .badge{vertical-align:2px}
.pending-group{margin:10px 0}
.pending-group>summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0}
.pending-group>summary .hold-meta{font-weight:400}
.group-title:first-child{margin-top:4px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid.wide .stage{aspect-ratio:16/9}
.players.wide-stage{grid-template-columns:1fr}
.players.wide-stage .stage{aspect-ratio:16/9}
.more{margin-top:14px}
dialog{border:0;border-radius:16px;padding:0;width:min(880px,calc(100% - 24px));max-height:calc(100% - 32px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:#000a}
.dlg-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.dlg-head h2{font-size:17px}
.dlg-body{padding:16px 18px 20px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.players figure{margin:0}
.players .stage{border-radius:12px;border:1px solid var(--line)}
.players figcaption{font-size:12px;color:var(--ink);margin-top:6px;justify-content:space-between}
.files{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.files li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.koma{margin-top:14px}
.koma summary{font-size:13px;font-weight:700;cursor:pointer;color:var(--accent);padding:4px 0}
.koma-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
.koma-head h3{margin:0}
.koma-head button{font-size:12px;padding:3px 10px;min-height:0;line-height:1.6}
.koma-head a{font-size:12px}
.koma-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.koma-tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.koma-tile .stage{aspect-ratio:1/1}
.koma-tile .stage .dl-fab{width:26px;height:26px;right:6px;bottom:6px}
.koma-tile .nm{font-size:11px;line-height:1.4;padding:6px 8px;color:var(--ink);display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.koma-tile .nm button{font-size:10px;padding:1px 6px;min-height:0;flex:none}
.hidden{display:none!important}
.card{position:relative}
.card .tag{position:absolute;top:8px;left:8px;z-index:1}
.dl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px}
.dl-tools button{font-size:12px;padding:3px 10px;min-height:0;line-height:1.6}
.dl-tools label{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.dl-tools button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .dl-tools button[aria-pressed="true"]{color:#14171c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dl-tools button[aria-pressed="true"]{color:#14171c}}
.pick{position:absolute;top:8px;right:8px;z-index:2;width:24px;height:24px;border-radius:7px;border:2px solid var(--accent);background:var(--surface);display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;pointer-events:none}
.on>.pick{background:var(--accent)}
.card.on,.icon-card.on{outline:3px solid var(--accent);outline-offset:-1px}
.icon-card{position:relative}
.selecting .icon-card,.selecting .card{cursor:pointer}
.dl-link{font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;min-height:30px;display:inline-flex;align-items:center;color:var(--accent);background:var(--surface);font-weight:600}
.dl-link:hover{border-color:var(--accent)}
.dlbar{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px #0001;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.dlbar strong{font-size:14px}
.dlbar .msg{font-size:12px;color:var(--muted);flex-basis:100%;text-align:center;margin:0}
.big{width:100%;max-height:70vh;object-fit:contain;background:var(--stage);border-radius:12px;border:1px solid var(--line);display:block}
.bg-pack{margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
.bg-pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:16px}
.bg-pack-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.bg-pack-card img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:var(--stage)}
.bg-pack-card .fname{padding:8px 10px 10px;gap:6px}
.bg-pack-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;display:grid;gap:8px}

<link rel="stylesheet" href="./ai-review/library-grid.css">
<script defer src="./ai-review/library-grid.js"></script>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <div class="brand">
    <button class="menu-btn" id="menu-btn" aria-label="メニューの表示・非表示" aria-controls="side" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1 id="page-name">でぷれさん素材ライブラリ</h1>
  </div>
  <a class="link-btn" id="drive-root" href="#" target="_blank" rel="noopener">ドライブのフォルダを開く</a>
</div></header>
<div class="layout">
  <nav class="side" id="side" aria-label="素材の種類"></nav>
  <div class="scrim" id="scrim"></div>
  <main class="shell">
    <h2 class="page-title" id="page-title"></h2>
    <section id="panel"></section>
  </main>
</div>
<div class="dlbar hidden" id="dlbar" role="region" aria-label="ダウンロード"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<script>
(async () => {
  const $ = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
  const base = f => f.replace(/\.(gif|png|mp4|jpg)$/i, "");
  let D;
  try { D = await (await fetch("data/library.json")).json(); }
  catch (e) { document.getElementById("panel").textContent = "データを読み込めませんでした。"; return; }
  // 11/18 このページの作りは、でぷれさんと共通素材（一つ上の階層）で共通。台帳にある種類だけタブを出す
  const isChar = !!D["キャラ"];
  if (D["ページ名"]) { document.getElementById("page-name").textContent = D["ページ名"]; document.title = D["ページ名"]; }
  document.getElementById("drive-root").href = isChar ? D["キャラ"]["ドライブ"] : D["ドライブ"];
  const CM = D["共通素材"];   // キャラのページ：共通素材の情報
  // 11/18 本人「リンクボタンをおく、ではなくて今までと同様に開けるようにリンクを埋め込んでください。」（意思決定DB 41bc12971e27812ab625ceaa50a1fb0a）
  //   → 大元は共通素材（一つ上の階層）のまま、キャラのページでは共通素材の台帳を読み込んで、今までどおりのタブで見せる
  if (CM) {
    try {
      const C = await (await fetch(CM["ページ"] + "data/library.json")).json();
      const fix = v => typeof v === "string" && v.startsWith("media/") ? CM["ページ"] + v : v;
      ["背景", "アイコン", "イメージ強化"].forEach(k => { D[k] = (C[k] || []).map(x => ({ ...x, src: fix(x.src), poster: fix(x.poster) })); });
      if (C["背景動画生成パック"]) D["背景動画生成パック"] = C["背景動画生成パック"].map(p => ({ ...p, 画像: (p["画像"] || []).map(x => ({ ...x, src: fix(x.src) })) }));
      // 11/20 本人「でぷれさんの素材ライブラリの共通素材系もちゃんと合わせてください。」：Claude Codeキャラ（中の要望素材も）も共通素材のページと同じに出す
      if (C["Claude Codeキャラ"]) {
        D["Claude Codeキャラ"] = C["Claude Codeキャラ"].map(x => ({ ...x, src: fix(x.src) }));
        D["Claude Codeキャラの要望素材"] = (C["Claude Codeキャラの要望素材"] || []).map(g => ({ ...g, 素材: g["素材"].map(x => ({ ...x, src: fix(x.src), 比べる: fix(x["比べる"]) })) }));
      }
      ["背景のドライブ", "アイコンのドライブ", "イメージ強化のドライブ"].forEach(k => { if (C[k]) D[k] = C[k]; });
      // 11/20 本人「おすすめで作る」（意思決定DB 41ec12971e278191a188c6f94f4f8484）：本人の保留（一つ上の階層）のうち、このキャラの物も種類のタブに「未採用」で出す
      D["上の保留"] = (C["保留"] || []).filter(g => g["キャラ名"] === (D["キャラ"] || {})["名前"]).map(g => ({ ...g, 素材: g["素材"].map(x => ({ ...x, src: fix(x.src), 比べる: fix(x["比べる"]) })) }));
    } catch (e) { ["背景", "アイコン", "イメージ強化"].forEach(k => { D[k] = []; }); }
  }

  // 11/20 共通素材のページ：キャラのページの要望素材のうち、背景・アイコン・イメージ強化の物も、種類のタブに「未採用」で出す
  if (!isChar) {
    try {
      const T = await (await fetch("../data/characters.json")).json();
      D["キャラの要望素材"] = (await Promise.all((T["キャラ"] || []).map(async c => {
        try {
          const L = await (await fetch(`../${c.id}/data/library.json`)).json();
          const fix = v => typeof v === "string" && v.startsWith("media/") ? `../${c.id}/` + v : v;
          return (L["要望素材"] || []).map(g => ({ ...g, キャラ名: c["名前"], 素材: g["素材"].filter(x => ["背景", "アイコン", "イメージ強化"].includes(x["種類"])).map(x => ({ ...x, src: fix(x.src), 比べる: fix(x["比べる"]) })) })).filter(g => g["素材"].length);
        } catch (e) { return []; }
      }))).flat();
    } catch (e) { D["キャラの要望素材"] = []; }
  }

  // 画面に見えているカードだけコマ送りで動かす
  const players = new Set();
  function player(img, frames) {
    const p = { img, frames, i: 0, t: null, on: false };
    p.show = i => { p.i = i; img.src = frames[i].src; };
    p.step = () => { p.show((p.i + 1) % frames.length); p.t = setTimeout(p.step, frames[p.i].ms); };
    p.play = () => { if (p.on) return; p.on = true; p.t = setTimeout(p.step, frames[p.i].ms); };
    p.stop = () => { p.on = false; clearTimeout(p.t); };
    p.show(0); players.add(p); return p;
  }
  const io = new IntersectionObserver(es => es.forEach(e => { const p = e.target._p; if (!p) return; e.isIntersecting ? p.play() : p.stop(); }), { rootMargin: "80px" });

  const first = fr => fr && fr[0] && fr[0].src;
  // 11/18 本人（意思決定DBに登録済み）：ミニキャラ（口パク・全身の動き・掛け合い）／Vtuber（等身大。一旦、生成時期別）／その他（マイクラ）。
  //   素材（背景・アイコン・イメージ強化）の大元は一つ上の階層（共通素材）に置き、キャラのページにはリンクだけを出す
  const has = k => Array.isArray(D[k]) ? true : !!D[k];
  const SG = isChar ? "素材（キャラ共通）" : "素材";
  // 11/18 本人「Vtuber（等身大）も一括に並べるのではなく口パクや全身の動きのようにページを分けてください。」（意思決定DB 41bc12971e27812ab625ceaa50a1fb0a）
  //   → 生成時期ごとにタブを分ける（今の版のタブは前と同じ #life）
  // 11/18 本人「上の階層だけ」（意思決定DB 41cc12971e27816a96c1c9f93186d1b1）：保留を上の階層へ移した時期は、採用して下ろすまで隠す（"非表示"）
  const PERIODS = ((D["等身大"] && D["等身大"]["時期"]) || []).filter(p => !p["非表示"]);
  const holdOf = id => (D["保留"] || []).find(g => g.id === id);
  const periodItems = p => p["今の版"] ? D["等身大"]["動作"] : (p["保留のID"] || []).length ? p["保留のID"].map(holdOf).filter(Boolean).flatMap(g => g["素材"]) : (p["素材"] || []);
  const periodId = p => p["今の版"] ? "life" : "life" + p.id.slice(1);
  const periodTabs = PERIODS.map(p => {
    const items = periodItems(p), firstImg = items.map(x => x.src).find(x => x && !/\.mp4$/.test(x));
    return { id: periodId(p), group: "Vtuber", label: p["タブ名"] || p["名前"], n: items.length, period: p,
      frames: p["今の版"] ? D["等身大"]["動作"][0]["コマ"] : null, thumb: p["今の版"] ? null : firstImg, render: () => renderPeriod(p) };
  });
  const TABS = [
    { id: "home", label: "TOP", render: renderHome },
    has("口パク") && { id: "lip", group: "ミニキャラ", label: "口パク", n: D["口パク"].length, thumb: first(D["口パク"][0]["向き"]["正面"]), frames: D["口パク"][0]["向き"]["正面"], render: () => renderMotions("lip") },
    has("全身") && { id: "body", group: "ミニキャラ", label: "全身の動き", n: D["全身"].length, frames: D["全身"][0]["コマ"], render: () => renderMotions("body") },
    has("掛け合い") && { id: "duet", group: "ミニキャラ", label: "掛け合い", n: D["掛け合い"].length, frames: D["掛け合い"][0]["コマ"], render: () => renderMotions("duet") },
    ...(PERIODS.length ? periodTabs : [has("等身大") && { id: "life", group: "Vtuber", label: "Vtuber（仮置き）", n: D["等身大"]["動作"].length, frames: D["等身大"]["動作"][0]["コマ"], render: () => renderProv("等身大") }]),
    has("マイクラ") && { id: "mc", group: "その他", label: "マイクラ（仮置き）", n: D["マイクラ"]["動作"].length, frames: D["マイクラ"]["動作"][0]["コマ"], render: () => renderProv("マイクラ") },
    has("背景") && { id: "bg", group: SG, label: "背景", n: D["背景"].length, thumb: D["背景"][0] && D["背景"][0].poster, cover: true, render: renderBg },
    has("アイコン") && { id: "icon", group: SG, label: "アイコン", n: D["アイコン"].length, icons: D["アイコン"].slice(0, 4).map(x => x.src), render: renderIcons },
    has("イメージ強化") && { id: "img", group: SG, label: "イメージ強化", n: D["イメージ強化"].length, icons: D["イメージ強化"].filter(x => !/\.mp4$/i.test(x.src)).length ? D["イメージ強化"].filter(x => !/\.mp4$/i.test(x.src)).slice(0, 4).map(x => x.src) : null, render: renderImage },
    // 11/19 本人「Claude Codeキャラ用の素材ライブラリページ作りたいです。階層は共通素材のアイコンやイメージ素材と同じ階層にClaude Codeキャラです。」→「共通素材の中に並べる」
    //   （意思決定DB 41dc12971e27812e9136de1797481e43・41dc12971e278192a110e40da35606b2）
    // 11/19 本人「Claude Codeのキャラクターはそこから細分化する必要ない。」「Claude Codeキャラの中の要望素材フォルダを作ってその中に依頼の文章作成ツールも含めて格納して。」
    //   （41dc12971e27817d9c6dc705a8293594・41dc12971e27817c86bac66ab40769e4）→ 中を分けない1つの一覧と、その中の「要望素材」
    has("Claude Codeキャラ") && { id: "cc", group: SG, label: "Claude Codeキャラ", n: "正式 " + D["Claude Codeキャラ"].length,
      icons: D["Claude Codeキャラ"].slice(0, 4).map(x => x.src), render: renderCC },
    has("Claude Codeキャラ") && { id: "ccreq", group: SG, sub: true, label: "要望素材", n: (D["Claude Codeキャラの要望素材"] || []).reduce((a, g) => a + g["素材"].length, 0), render: renderCCReq },
    has("台本") && { id: "script", group: "台本・音声", label: "台本", n: D["台本"].length, render: renderScripts },
    // 11/18 本人「別口で「要望素材」みたいなカテゴリを素材ライブラリに用意してそこに格納したい。…各キャラクターページそれぞれに「要望素材」があるイメージ。」（意思決定DB 41cc12971e278179b8c0c7d8a228e510）
    has("要望素材") && { id: "req", group: "確かめの場", label: "要望素材", n: (D["要望素材"] || []).reduce((a, g) => a + g["素材"].length, 0), render: renderReq },
    has("保留") && { id: "hold", group: "確かめの場", label: "保留", n: (D["保留"] || []).reduce((a, g) => a + g["素材"].length, 0), render: renderHold },
  ].filter(Boolean);
  const side = document.getElementById("side"), root = document.documentElement;
  let panel = document.getElementById("panel");   // 11/20 「未採用」の節で、組ごとの開け閉めの枠の中へ描くために一時的に差し替える
  const narrow = matchMedia("(max-width:820px)");
  // 11/18 返信のURL（#組のID）から、その組の素材へ直接行けるようにする
  const groupTab = h => (D["要望素材"] || []).some(g => g.id === h) ? "req" : (D["保留"] || []).some(g => g.id === h) ? "hold" : (D["Claude Codeキャラの要望素材"] || []).some(g => g.id === h) ? "ccreq" : null;
  const fromHash = () => { const h = decodeURIComponent(location.hash.slice(1)); return TABS.some(t => t.id === h) ? h : (groupTab(h) && TABS.some(t => t.id === groupTab(h))) ? groupTab(h) : "home"; };
  const toGroup = () => { const h = decodeURIComponent(location.hash.slice(1)); const el = h && groupTab(h) && document.getElementById(h); if (el) { el.classList.add("group-target"); setTimeout(() => el.scrollIntoView({ block: "start" }), 50); } };
  let current = fromHash();
  const state = { angle: "正面" };
  let group = null;
  TABS.forEach(t => {
    if (t.group && t.group !== group) { group = t.group; side.append($("h2", "", group)); }
    const b = $("button", "", t.label); if (t.n != null) b.append($("span", "", t.n));
    b.addEventListener("click", () => go(t.id));
    if (t.sub) b.classList.add("sub"); t.btn = b; side.append(b);
  });
  function go(id) {
    if (narrow.matches) setMenu(false);
    if (id === current) { window.scrollTo(0, 0); return; }
    if (id === "home") { history.pushState(null, "", location.pathname + location.search); current = "home"; draw(); }
    else location.hash = id;  // hashchange で描き直す
  }
  const onNav = () => { const h = fromHash(); if (h !== current) { current = h; draw(); } toGroup(); };
  addEventListener("hashchange", onNav); addEventListener("popstate", onNav);
  // メニューの表示・非表示（広い画面では閉じた状態を覚える。狭い画面では横から出す）
  let wideOpen = true;
  try { wideOpen = localStorage.getItem("depure-menu") !== "closed"; } catch (e) {}
  function setMenu(open) {
    if (narrow.matches) { root.classList.toggle("side-open", open); root.classList.remove("side-closed"); }
    else { wideOpen = open; root.classList.toggle("side-closed", !open); root.classList.remove("side-open"); try { localStorage.setItem("depure-menu", open ? "open" : "closed"); } catch (e) {} }
    document.getElementById("menu-btn").setAttribute("aria-expanded", String(open));
  }
  const menuOpen = () => narrow.matches ? root.classList.contains("side-open") : !root.classList.contains("side-closed");
  document.getElementById("menu-btn").addEventListener("click", () => setMenu(!menuOpen()));
  document.getElementById("scrim").addEventListener("click", () => setMenu(false));
  narrow.addEventListener("change", () => setMenu(narrow.matches ? false : wideOpen));
  setMenu(narrow.matches ? false : wideOpen);
  function draw() {
    players.forEach(p => { p.stop(); io.unobserve(p.img.parentElement); }); players.clear();
    TABS.forEach(t => t.id === current ? t.btn.setAttribute("aria-current", "page") : t.btn.removeAttribute("aria-current"));
    const t = TABS.find(t => t.id === current);
    document.getElementById("page-title").textContent = t.id === "home" ? "素材の一覧" : t.label;
    panel.replaceChildren(); panel.classList.toggle("selecting", sel.on);
    if (t.id !== "home" && !t.link) dlTools(); t.render(); dlBar();
    window.scrollTo(0, 0);
  }
  function renderHome() {
    panel.append($("p", "home-lead", "見たい素材を選んでください。左のメニューからも移れます。"));
    let g = null, tiles;
    TABS.filter(t => t.group).forEach(t => {
      if (t.group !== g) { g = t.group; panel.append($("h3", "home-group", g)); tiles = $("div", "tiles"); panel.append(tiles); }
      const b = $("button", "tile"), th = $("div", "thumb" + (t.cover ? " cover" : ""));
      if (t.frames) { const img = $("img"); img.alt = ""; img.loading = "lazy"; th.append(img); th._p = player(img, t.frames); io.observe(th); }
      else if (t.thumb) { const img = $("img"); img.alt = ""; img.loading = "lazy"; img.src = t.thumb; th.append(img); }
      else if (t.icons) { th.style.gridTemplateColumns = "repeat(2,48px)"; th.style.gap = "14px"; th.style.alignContent = "center"; th.style.justifyContent = "center";
        t.icons.forEach(src => { const img = $("img"); img.alt = ""; img.src = src; img.style.width = "48px"; img.style.height = "48px"; th.append(img); }); }
      else if (t.id === "img") { const first = (D["イメージ強化"] || [])[0]; if (first) { const mv = /\.mp4$/i.test(first.src), el = mv ? $("video") : $("img"); if (mv) { el.muted = true; el.preload = "metadata"; el.src = first.src + "#t=0.5"; } else { el.alt = ""; el.loading = "lazy"; el.src = first.src; } th.append(el); } else { th.append($("div", "script-mark", "今はなし")); } }
      else if (t.link) { const m = $("div", "script-mark", "共通素材のページへ"); th.append(m); }
      else if (t.id === "hold" || t.id === "req") { const first = (D[t.id === "hold" ? "保留" : "要望素材"] || []).flatMap(g => g["素材"]).slice(-1)[0]; if (first) { const img = /\.mp4$/.test(first.src) ? $("video") : $("img"); if (img.tagName === "VIDEO") { img.muted = true; img.preload = "metadata"; img.src = first.src + "#t=0.5"; } else { img.alt = ""; img.loading = "lazy"; img.src = first.src; } th.append(img); } else { const m = $("div", "script-mark", "今はなし"); th.append(m); } }
      else { const m = $("div", "script-mark"); m.textContent = D["台本"].map(x => x["名前"]).join("\n"); m.style.whiteSpace = "pre-line"; th.append(m); }
      const cap = $("div", "cap", t.label); cap.append($("span", "", t.n));
      b.append(th, cap); b.addEventListener("click", () => go(t.id)); tiles.append(b);
    });
    const h = $("div", "howto"); h.append($("h2", "", "ダウンロードのしかた"));
    const ul = $("ul");
    ["各素材の右下の↓ボタンで、その素材を1つ保存できます", "「選んでダウンロード」で、素材を選んでまとめて保存できます", "「まとめてダウンロード」で、そのページの素材をすべて保存できます",
     "保存には、素材フォルダを共有されたGoogleアカウントでのログインが必要です"].forEach(x => ul.append($("li", "", x)));
    h.append(ul); panel.append(h);
  }

  // ---------- ダウンロード ----------
  // ファイルはドライブから直接受け取る（ドライブの共有の設定に従う）
  const DL = id => `https://drive.usercontent.google.com/download?id=${id}&export=download`;
  const sel = { on: false, koma: false, items: new Map(), busy: false, msg: "" };  // items: item → タブのid
  const TAB_ITEMS = { script: () => D["台本"], lip: () => D["口パク"], body: () => D["全身"], duet: () => D["掛け合い"], bg: () => D["背景"],
    icon: () => D["アイコン"], img: () => D["イメージ強化"], hold: () => (D["保留"] || []).flatMap(g => g["素材"]), req: () => (D["要望素材"] || []).flatMap(g => g["素材"]), cc: () => D["Claude Codeキャラ"] || [], ccreq: () => (D["Claude Codeキャラの要望素材"] || []).flatMap(g => g["素材"]), life: () => D["等身大"]["動作"], mc: () => D["マイクラ"]["動作"] };
  PERIODS.forEach(p => { TAB_ITEMS[periodId(p)] = () => periodItems(p); });
  const hasKoma = id => TAB_ITEMS[id]().some(x => (x.dl || []).some(f => f[2] === "コマ"));
  const filesOf = it => (it.dl || []).filter(f => f[2] !== "コマ" || sel.koma);
  function dlFab(f) {
    const a = $("a", "dl-fab"); a.href = DL(f[1]); a.rel = "noopener"; a.title = "ダウンロード：" + f[0]; a.setAttribute("aria-label", "ダウンロード：" + base(f[0]));
    a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>';
    a.addEventListener("click", e => e.stopPropagation()); return a;
  }
  function dlLink(f, label = "ダウンロード") { const a = $("a", "dl-link", label); a.href = DL(f[1]); a.rel = "noopener"; a.title = f[0]; a.addEventListener("click", e => e.stopPropagation()); return a; }
  function dlTools() {
    const w = $("div", "dl-tools");
    const pick = $("button", "", sel.on ? "選ぶのをやめる" : current === "cc" ? "正式素材を選んでダウンロード" : "選んでダウンロード"); pick.setAttribute("aria-pressed", String(sel.on));
    pick.addEventListener("click", () => { sel.on = !sel.on; if (!sel.on) sel.items.clear(); draw(); });

    sel.busy = true;

        card.append(img, fn); pg.append(card);
      });
      sec.append(pg);
      const pr = pk["プロンプト"];
      if (pr) {
        const box = $("div", "bg-pack-box");
        box.append($("strong", "", pr["対象"]), $("p", "hold-meta", pr["設定"]));
        const rEn = $("div", "row"); rEn.append($("strong", "", "英語プロンプト（Runway / Topview 貼り付け用）"), copyBtn(pr["英語"], "英語をコピー"));
        box.append(rEn, $("pre", "", pr["英語"]));
        const rJa = $("div", "row"); rJa.append($("strong", "", "日本語プロンプト（構造対応確認用）"), copyBtn(pr["日本語"], "日本語をコピー"));
        box.append(rJa, $("pre", "", pr["日本語"]));
        if ((pr["全区間"] || []).length) {
          const dt = $("details", "snd"); dt.append($("summary", "", "全6区間マップ（00–60秒）"));
          const ul = $("ul", "files");
          pr["全区間"].forEach(line => ul.append($("li", "", line)));
          dt.append(ul); box.append(dt);
        }
        sec.append(box);
      }
      panel.append(sec);
    });
    pendingSection(["背景"]);
  }
  function renderIcons() {
    // 11/20 要望素材から採用したアイコンは「要望素材から」の組。決まった組にない組も最後に出す
    const groups = [...new Set(["アプリ", "文字バッジ", "ドット絵", "Codex", "ChatGPTペット", "note・Claudeのキャラ", ...D["アイコン"].map(x => x["組"]).filter(Boolean)])];
    const label = { "アプリ": "アプリアイコン", "ドット絵": "ドット絵キャラ", "Codex": "Codexキャラ" };
    groups.forEach(grp => {
      const items = D["アイコン"].filter(x => x["組"] === grp);
      if (!items.length) return;
      panel.append($("h2", "group-title", `${label[grp] || grp}（${items.length}）`));
      const g = $("div", "icon-grid");
      items.forEach(x => {
        const c = $("div", "icon-card" + (x["暗い背景"] ? " dark" : "")), im = $("img"); im.src = x.src; im.alt = base(x["ファイル"]); im.loading = "lazy";
        c.append(im, $("strong", "", base(x["ファイル"]))); if (x["仮置き"]) c.append($("span", "badge warn tag", "仮置き")); if (x.dl && x.dl[0] && !sel.on) c.append(dlFab(x.dl[0]));
        pickable(c, x); c.addEventListener("click", () => togglePick(c, x)); g.append(c);
      });
      panel.append(g);
    });
    pendingSection(["アイコン"]);
  }

  // 11/19 本人「ドット絵キャラ_基本とかの名前も「基本」とかにしてダウンロードしたら素材名が「Claude Codeキャラ_基本」とかでいい。」
  //   「案A（20枚のまま）」（41dc12971e278125a69ae427ee8638f9）：保留の20点も、止まった絵と動く絵を別の枚のまま並べる
  const FOLDER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.2l2 2.2h8.8A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>';
  const ccName = x => x["名前"] || base(x["ファイル"]).replace(/^(ドット絵キャラ|Claude Codeキャラ)_/, "");
  function renderCC() {
    const gallery = document.createElement("cc-library-grid");
    if (!sel.on) panel.append(gallery);
    const reqs = D["Claude Codeキャラの要望素材"] || [], nReq = reqs.reduce((a, g) => a + g["素材"].length, 0);
    const fd = $("button", "folder-card"); fd.type = "button"; fd.innerHTML = FOLDER_SVG;
    const t = $("span", "folder-txt"); t.append($("strong", "", `要望素材（${nReq}）`), $("span", "", "依頼の文を作る道具と、Chatworkの要望で作った素材"));
    fd.append(t); fd.addEventListener("click", () => go("ccreq")); panel.append(fd);
    const g = $("div", "icon-grid");
    D["Claude Codeキャラ"].forEach(x => {
      const c = $("div", "icon-card pixel cc-sprite"), im = $("img"); im.src = x.src; im.alt = ccName(x); im.loading = "lazy";
      c.append(im, $("strong", "", ccName(x))); if (x["仮置き"]) c.append($("span", "badge warn tag", "仮置き")); if (x.dl && x.dl[0] && !sel.on) c.append(dlFab(x.dl[0]));
      pickable(c, x); c.addEventListener("click", () => togglePick(c, x)); g.append(c);
    });
    if (sel.on) panel.append(g);
    else {
      const originals = $("details", "cc-official");
      originals.append($("summary", "", "正式素材のダウンロード"), g);
      panel.append(originals);
    }
    const records = $("a", "crumb-link", "チェック記録・メモを開く");
    records.href = "./ai-review/";
    panel.append(records);
    pendingSection([], { cc: true });
  }
  function renderCCReq() {
    const bc = $("nav", "crumb"), up = $("button", "crumb-link", "Claude Codeキャラ"); up.type = "button"; up.addEventListener("click", () => go("cc"));
    bc.append(up, " ▸ 要望素材"); panel.append(bc);
    reqMaker({ chara: "Claude Code", kinds: false, example: "例：考え込んでから、ひらめいて喜ぶ" });   // 11/19 本人「…共通素材系は種類なしで受ける…」：種類を選ばせない
    const groups = D["Claude Codeキャラの要望素材"] || [];
    if (!groups.length) { panel.append($("p", "hold-empty", "今は要望素材はありません。")); return; }
    groups.slice().reverse().forEach(g => {
      const h = $("h2", "group-title", `${g["依頼"].replace(/^ClaudeCodeキャラ_/, "")}（${g["素材"].length}）`); h.id = g.id; panel.append(h);
      panel.append($("p", "hold-meta", `${g["届いた日"]} 届いた・${g["出どころ"]}`));
      holdGrid(g, true);
    });
  }

  // 11/14 本人（意思決定DBに登録済み）：保留の素材（Chatwork経由の依頼で作ったものを含む）も公開ページに出す
  function renderHold() {
    // 11/20 説明文は外した（11/18 の問い「保留のタブの説明文」。本人 11/20「おすすめ通りでいい」意思決定DB 41ec12971e27811a9adbe336c576b7b7）
    const groups = D["保留"] || [];
    if (!groups.length) { panel.append($("p", "hold-empty", "今は保留の素材はありません。")); return; }
    if (D["保留のドライブ"]) { const a = $("a", "link-btn", "保留のフォルダを開く"); a.href = D["保留のドライブ"]; a.target = "_blank"; a.rel = "noopener"; panel.append(a); }
    // 11/14 新しく届いたものを上に出す
    groups.slice().reverse().forEach(g => {
      const h = $("h2", "group-title", `${groupName(g)}（${g["素材"].length}）`); h.id = g.id; panel.append(h);
      panel.append($("p", "hold-meta", `${g["届いた日"]} 届いた・${g["出どころ"]}` + (g["キャラ名"] ? `・${g["キャラ名"]}` : "")));
      holdGrid(g);
    });
  }
  // 11/18 要望素材：Chatworkの要望で作った素材（本人が作った保留とは別に置く）
  // 11/18 本人「Chatworkでの入力がしやすいようにカテゴリとかは選択式で選んで最後に希望を入力するようなツールを素材ライブラリに作りたいね。…
  //   後、Chatworkの要望で作った素材です。新しく届いたものを上に出します。は削除で。要望素材は素材ライブラリ側からもダウンロードできるように。」（意思決定DB 41cc12971e2781b0adf2fce903e39c62）
  // 作る文は ~/Code/systems/library/chatwork/intake.py が読む型（[info][title]素材の生成[/title] キャラ／種類／中身）にそろえる
  const REQ_KINDS = ["口パク", "全身の動き", "掛け合い", "Vtuber", "マイクラ", "アイコン", "イメージ強化", "背景", "そのほか"];
  // 11/19 本人「足して公開して」（意思決定DB 41cc12971e2781029483d4804c865d63）：8種類とも受け付けるので、マイクラのボタンを足した
  // 11/18 本人「いつまでにの項目はいらないかな。／動画の明るさ・質感の調整は、調整ツールの「設定をコピー」から頼めますの文もいらない」（同じ行）→ 外した
  function reqMaker(opt) {
    opt = opt || {};
    const box = $("details", "req-maker"), chara = opt.chara || (D["キャラ"] || {})["名前"] || D["ページ名"] || "", kinds = opt.kinds === false ? [] : (opt.kinds || REQ_KINDS);   // kinds: false で種類を選ばせない
    box.append($("summary", "link-btn", "依頼の文を作る"));
    const kindRow = $("div", "req-kinds"); kindRow.setAttribute("role", "radiogroup"); kindRow.setAttribute("aria-label", "種類");
    let kind = kinds[0];
    const field = (label, el, opt) => { const l = $("label", "req-field"); l.append($("span", "", label + (opt ? "（あれば）" : "")), el); return l; };
    const what = $("textarea"); what.id = "req-what"; what.rows = 2; what.placeholder = opt.example || "例：驚いて「えっ」と言う";
    const ref = $("input"); ref.id = "req-ref"; ref.type = "text"; ref.placeholder = "例：参考の動画のURL、似せたい素材の名前";
    const out = $("pre", "req-out"), copy = $("button", "", "文をコピー"), note = $("p", "req-note", "");
    // 11/18 本人の見本で型を変えた：題「素材の生成」、項目に■を付けない（意思決定DB DEC-2129 41cc12971e2781efb043dabd9e410408）
    const text = () => ["[info][title]素材の生成[/title]", `キャラ：${chara}`, ...(kind ? [`種類：${kind}`] : []), `中身：${what.value.trim().replace(/\s*\n\s*/g, "　")}`]
      .concat(ref.value.trim() ? [`参考：${ref.value.trim()}`] : [], ["[/info]"]).join("\n");
    const update = () => { out.textContent = text(); copy.disabled = !what.value.trim(); note.textContent = what.value.trim() ? "" : "中身を書くと、コピーできます"; };
    kinds.forEach((k, i) => { const b = $("button", "", k); b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", i === 0 ? "true" : "false");
      b.addEventListener("click", () => { kind = k; kindRow.querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", x === b ? "true" : "false")); update(); }); kindRow.append(b); });
    [what, ref].forEach(el => el.addEventListener("input", update));
    copy.type = "button";
    copy.addEventListener("click", async () => { try { await navigator.clipboard.writeText(text()); copy.textContent = "コピーしました"; note.textContent = "Chatworkの動画素材要望グループに貼って送ると、受け付けます"; }
      catch (e) { const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); note.textContent = "コピーできなかったので、文を選びました。そのまま写してください"; }
      setTimeout(() => copy.textContent = "文をコピー", 1800); });
    if (kinds.length) box.append(field("種類", kindRow)); box.append(field("中身（どんな素材がほしいか）", what), field("参考", ref, true));
    const foot = $("div", "req-foot"); foot.append(copy, note); box.append($("span", "req-label", "Chatworkに貼る文"), out, foot);
    update(); panel.append(box);
  }
  function renderReq() {
    reqMaker();
    const groups = D["要望素材"] || [];
    if (!groups.length) { panel.append($("p", "hold-empty", "今は要望素材はありません。")); return; }
    if (D["要望素材のドライブ"]) { const a = $("a", "link-btn", "要望素材のフォルダを開く"); a.href = D["要望素材のドライブ"]; a.target = "_blank"; a.rel = "noopener"; panel.append(a); }
    groups.slice().reverse().forEach(g => {
      const h = $("h2", "group-title", `${g["依頼"]}（${g["素材"].length}）`); h.id = g.id; panel.append(h);
      panel.append($("p", "hold-meta", `${g["届いた日"]} 届いた・${g["出どころ"]}`));
      holdGrid(g);
    });
  }
  function holdGrid(g, pixelCard, pendingMark) {
    {
      const isNativeGif = x => /新規動作20種$/.test(g["依頼"]) && (x["種類"] === "Vtuber" || x["種類"] === "等身大") && /\.gif$/.test(x.src);
      const grid = $("div", "icon-grid" + (g["素材"].some(x => x["比べる"]) ? " hold-grid-wide" : "") +
        (g["素材"].some(isNativeGif) ? " hold-native-grid" : ""));
      g["素材"].forEach(x => {
        // 11/14 動く素材の見本（mp4）は、動きと画質を見られるように大きめの動画で出す
        const mv = /\.mp4$/.test(x.src), nativeGif = isNativeGif(x);
        const c = $("div", "icon-card hold-card" + (mv ? " hold-movie" : "") + (nativeGif ? " hold-native-gif" : "") + (pixelCard ? " pixel cc-sprite" : "")), im = mv ? $("video") : $("img");
        if (mv) { im.muted = true; im.loop = true; im.autoplay = true; im.playsInline = true; im.preload = "metadata"; im.src = x.src; im.setAttribute("aria-label", x["名前"]); }
        else { im.src = x.src; im.alt = x["名前"]; im.loading = "lazy"; }
        // 11/14 同じ名前の素材が既にあるとき（差し替えの候補）は、今の版と同じ高さで並べて見比べる
        if (x["比べる"]) { const cmp = $("div", "hold-compare"), o = $("figure"), n = $("figure"), oi = $("img"); oi.src = x["比べる"]; oi.alt = "今の版"; oi.loading = "lazy";
          o.append(oi, $("figcaption", "", "今の版")); n.append(im, $("figcaption", "", "届いた版")); cmp.append(o, n); c.append(cmp); }
        else c.append(im);
        if (pendingMark) c.append($("span", "badge warn tag", "未採用"));
        c.append($("strong", "", x["名前"])); if (!pixelCard) c.append($("span", "hold-kind", x["種類"]));
        if (x._when) c.append($("span", "hold-kind", x._when)); c.append($("span", "hold-state s-" + x["状態"], x["状態"]));
        if (x["メモ"]) { const m = $("span", "hold-memo", x["メモ"]); m.title = x["メモ"]; c.append(m); }
        if (nativeGif && !sel.on) {
          const original = $("a", "link-btn small-btn hold-open", "原寸GIFを開く");
          original.href = x.src; original.target = "_blank"; original.rel = "noopener";
          original.setAttribute("aria-label", x["名前"] + "の原寸GIFを開く");
          original.addEventListener("click", e => e.stopPropagation()); c.append(original);
        }
        if (x.dl && x.dl[0] && !sel.on) c.append(dlFab(x.dl[0]));
        pickable(c, x); c.addEventListener("click", () => togglePick(c, x)); grid.append(c);
      });
      panel.append(grid);
    }
  }

  draw(); toGroup();
})();
</script>
