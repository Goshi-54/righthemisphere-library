<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>素材ライブラリ</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --surface: #fff; --ink: #1c2230;
    --muted: #5d6676; --line: #e2e5ea; --accent: #2563c9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --surface: #1c2027; --ink: #e6e9ee;
      --muted: #9aa3b2; --line: #2c323c; --accent: #7fa8ee;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }
  header { background: var(--surface); border-bottom: 1px solid var(--line); }
  h1, main { max-width: 1100px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); }
  h1 { padding-block: 16px; font-size: 20px; }
  main { padding-block: 24px 48px; }
  nav {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
  }
  .card {
    display: flex; flex-direction: column; gap: 6px;
    min-height: 122px; padding: 20px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); text-decoration: none;
  }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card strong { font-size: 18px; color: var(--accent); }
  .card span { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<header><h1>素材ライブラリ</h1></header>
<main>
  <nav aria-label="素材ライブラリの入口">
    <a class="card" href="./depure/">
      <strong>でぷれさん</strong>
      <span>口パク・全身の動き・収録素材</span>
    </a>
    <a class="card" href="./common/">
      <strong>共通素材</strong>
      <span>背景・アイコン・イメージ強化などの編集素材</span>
    </a>
    <a class="card" href="./common/#hold">
      <strong>保留</strong>
      <span>採否の確認を待っている素材</span>
    </a>
    <a class="card" href="https://claude.ai/artifact/Gq1dGzo4nk8wjXxXChk5jM" target="_blank" rel="noopener">
      <strong>編集の名前帳</strong>
      <span>テロップ・動き・切り替えなどの名前一覧</span>
    </a>
    <a class="card" href="./adjust/">
      <strong>生成素材の調整ツール</strong>
      <span>画像や動画の明るさ・質感を調整</span>
    </a>
  </nav>
</main>
</body>
</html>
