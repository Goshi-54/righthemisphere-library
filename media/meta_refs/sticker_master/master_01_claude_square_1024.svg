<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="ds" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- 実動画12:10黄金比基準（全幅720px × 全高600px、中央配置、白フチ42px） -->
  <!-- 1単位 = 60px: 胴体幅600(10u)、左右耳各60(1u)、胴体高450(7.5u)、脚高150(2.5u) -->
  <g filter="url(#ds)">
    <!-- 純白ダイカット外周（一体包囲） -->
    <path d="M212,212 H812 V332 H872 V482 H812 V662 H772 V812 H664 V686 H640 V812 H532 V662 H492 V812 H384 V686 H360 V812 H252 V662 H212 V482 H152 V332 H212 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="84" stroke-linejoin="round"/>
    <!-- 内側2本脚（暗いテラコッタ陰影 #B85238） -->
    <rect x="384" y="652" width="108" height="160" fill="#B85238"/>
    <rect x="532" y="652" width="108" height="160" fill="#B85238"/>
    <!-- 本体＋左右耳突起＋外側2本脚（テラコッタ #DC6847） -->
    <path d="M212,212 H812 V332 H872 V482 H812 V662 H772 V812 H664 V662 H360 V812 H252 V662 H212 V482 H152 V332 H212 Z"
          fill="#DC6847"/>
    <!-- 正方形黒目（ハイライトなし 74x74、上から2.2u） -->
    <rect x="342" y="344" width="74" height="74" fill="#111111"/>
    <rect x="608" y="344" width="74" height="74" fill="#111111"/>
  </g>
</svg>
